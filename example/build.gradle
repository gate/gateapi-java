
plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // The generator fills the adjacent SDK version; install that candidate locally first.
    implementation 'io.gate:gate-api:7.2.172'
    implementation 'commons-cli:commons-cli:1.5.0'
}

group = 'io.gate.apidemo'
version = '1.0-SNAPSHOT'
description = 'gateapi-demo'
sourceCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainClassName = 'io.gate.apidemo.Application'
}

// Example sources live beside this build file, not under src/main/java.
sourceSets.main.java { srcDirs = ['.']; exclude 'build/**' }
